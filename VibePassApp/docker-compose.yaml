services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: VibePass_web
    ports:
       - "8000:8000"
    volumes:
       - .:/app/VibePassApp
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
       - .env

  ngrok:
    image: ngrok/ngrok:latest
    command: 
       - "http"
       - "web:8000"
    ports: 
       - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
       - web

  nginx:
    image: nginx:alpine3.24-perl
    container_name: VibePass_nginx
    ports:
       - "80:80"
    volumes:
       - ./nginx/nginx-setup.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
       - web

  celery:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A VibePassApp worker --loglevel=info
    volumes:
      - .:/app/VibePassApp
    env_file:
      - .env
    container_name: celery
    depends_on:
      - web