# /etc/nginx/conf.d/default.conf

# Upstream definition
upstream django_app {
    server web:8000;
}

# Dynamic WebSocket Connection Header Map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=stk_limit:10m rate=1r/s;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # General application & WebSocket traffic
    location / {
        limit_req zone=ip_limit burst=20 nodelay;

        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_redirect off;
        proxy_read_timeout 600s;
    }

    # Strict rate limit for STK Push / Payments
    location /payments/initiate/ {
        limit_req zone=stk_limit burst=3 nodelay;

        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 600s;
    }
}